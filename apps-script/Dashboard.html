<title>CareTalk Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: icon rail + soft-aqua canvas of panels; module switch and episode rail drive every panel below. */
:root{
  --bg:#E6F0F1; --panel:#FFFFFF; --panel-2:#F3F8F8; --line:#D5E3E5;
  --ink:#0E1A1C; --muted:#5A6E71; --faint:#8DA2A5;
  --lime:#C9EA4E; --lime-ink:#1D2A05; --aqua:#9ACFDD; --aqua-deep:#2F7F96;
  --pill:#0E1A1C; --pill-ink:#FFFFFF;
  --yt:#E5484D; --fb:#3D7BF4; --tt:#13A89E;
  --good:#2E9E5B; --warn:#D98B12; --bad:#D6453D;
  --shadow:0 1px 2px rgba(14,26,28,.05),0 8px 24px -12px rgba(14,26,28,.12);
  --f:"Montserrat",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-xl:28px; --r-l:20px; --r-m:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1315; --panel:#132024; --panel-2:#18282C; --line:#24373B;
  --ink:#E7F1F2; --muted:#9BB0B3; --faint:#6C8386;
  --lime:#C9EA4E; --lime-ink:#1D2A05; --aqua:#2D6475; --aqua-deep:#8FD0E2;
  --pill:#E7F1F2; --pill-ink:#0B1315;
  --yt:#F2666A; --fb:#6A9BFF; --tt:#2CC7BC;
  --good:#4CC27C; --warn:#F0A93A; --bad:#F06A62;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1315; --panel:#132024; --panel-2:#18282C; --line:#24373B;
  --ink:#E7F1F2; --muted:#9BB0B3; --faint:#6C8386;
  --lime:#C9EA4E; --lime-ink:#1D2A05; --aqua:#2D6475; --aqua-deep:#8FD0E2;
  --pill:#E7F1F2; --pill-ink:#0B1315;
  --yt:#F2666A; --fb:#6A9BFF; --tt:#2CC7BC;
  --good:#4CC27C; --warn:#F0A93A; --bad:#F06A62;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-size:14px;font-weight:500;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:76px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 0;padding-left:env(safe-area-inset-left,0px)}
.logo{width:40px;height:40px;border-radius:12px;background:var(--pill);color:var(--lime);display:grid;place-items:center;font-weight:800;font-size:13px;margin-bottom:18px}
.rail a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted);text-decoration:none;transition:background .2s,color .2s}
.rail a:hover{background:var(--panel)}
.rail a.on{background:var(--lime);color:var(--lime-ink);box-shadow:0 6px 16px -6px rgba(140,180,20,.7)}
.rail svg{width:20px;height:20px}
.main{min-width:0;padding-block:22px 48px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:8px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;justify-content:space-between}
.hello h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.hello p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:999px;padding:10px 16px;min-width:0;width:240px;max-width:100%;box-shadow:var(--shadow)}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:13px}
.search svg{width:16px;height:16px;color:var(--faint);flex:none}
.seg{display:inline-flex;background:var(--panel);border-radius:999px;padding:5px;box-shadow:var(--shadow);position:relative}
.seg button{border:0;background:transparent;padding:9px 18px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;position:relative;z-index:1;transition:color .25s}
.seg .glider{position:absolute;top:5px;bottom:5px;border-radius:999px;background:var(--pill);transition:left .35s cubic-bezier(.3,1.4,.5,1),width .35s cubic-bezier(.3,1.4,.5,1)}
.seg button.on{color:var(--pill-ink)}
.btn{border:0;cursor:pointer;border-radius:999px;padding:10px 18px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:transform .12s,box-shadow .2s,background .2s}
.btn-dark{background:var(--pill);color:var(--pill-ink)}
.btn-ghost{background:var(--panel-2);color:var(--ink)}
.btn svg{width:16px;height:16px}
.btn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.press{transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.press:active,.press.tap{transform:scale(.94)}
:focus-visible{outline:2px solid var(--aqua-deep);outline-offset:2px}

.syncbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border-radius:var(--r-l);padding:10px 12px 10px 16px;box-shadow:var(--shadow);font-size:12.5px;font-weight:600;color:var(--muted)}
.syncbar .dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:none}
.syncbar.live .dot{background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 22%,transparent)}
.syncbar.err .dot{background:var(--bad)}
.syncbar b{color:var(--ink)}
.syncbar .grow{flex:1;min-width:200px}

.eprail{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin;scroll-snap-type:x proximity}
.ep{flex:none;scroll-snap-align:start;border:0;cursor:pointer;background:var(--panel);border-radius:16px;padding:10px 12px 9px;min-width:62px;text-align:left;box-shadow:var(--shadow);position:relative;transition:background .25s,color .25s}
.ep small{display:block;font-size:10px;font-weight:600;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.ep b{font-size:18px;font-weight:800;letter-spacing:-.02em}
.ep i{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--line)}
.ep i.has{background:var(--good)}
.ep.on{background:var(--pill);color:var(--pill-ink)}
.ep.on small{color:var(--lime)}

.grid{display:grid;gap:18px;grid-template-columns:repeat(12,minmax(0,1fr))}
.card{background:var(--panel);border-radius:var(--r-xl);padding:22px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.card h2 .ico{width:32px;height:32px;border-radius:10px;background:var(--panel-2);display:grid;place-items:center;flex:none}
.card h2 .ico svg{width:16px;height:16px}
.sub{color:var(--muted);font-size:12px;margin:4px 0 0}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.anim{animation:rise .55s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{transform:translateY(10px);opacity:.35}to{transform:none;opacity:1}}

.hero{grid-column:span 8;background:linear-gradient(135deg,var(--panel) 0%,var(--panel-2) 100%);position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.hero .eyebrow{display:inline-flex;gap:8px;align-items:center;background:var(--lime);color:var(--lime-ink);padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.hero h3{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.03em;margin:14px 0 6px;text-wrap:balance}
.hero .dept{color:var(--muted);font-weight:600}
.hero .big{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px}
.hero .big div span{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.hero .big div b{font-size:28px;font-weight:800;letter-spacing:-.03em}
.hero .contrib{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.gaugebox{text-align:center;position:relative}
.gauge{width:190px;max-width:100%}
.gaugebox p{margin:4px auto 0;font-size:11px;color:var(--muted);font-weight:600;max-width:190px}
.blob{position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--aqua) 0%,transparent 70%);opacity:.55;pointer-events:none;animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-30px,30px) scale(1.1)}}

.seedsum{grid-column:span 4;background:var(--aqua);color:var(--ink);display:flex;flex-direction:column;gap:14px}
.seedsum .sub{color:var(--ink);opacity:.75}
.cups{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.cup{aspect-ratio:1/1.15;max-width:100%;border-radius:4px 4px 9px 9px;background:rgba(255,255,255,.55);transition:background .4s}
.cup.f{background:var(--pill)}
.seedsum .bignum{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.seedsum .bignum small{font-size:16px;font-weight:600;opacity:.7}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.lime{background:var(--lime);color:var(--lime-ink)}
.chip.dark{background:var(--pill);color:var(--pill-ink)}
.chip.soft{background:var(--panel-2);color:var(--ink)}
.chip.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
button.chip{border:0;cursor:pointer}

.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.tile{background:var(--panel);border-radius:var(--r-l);padding:16px 16px 14px;box-shadow:var(--shadow);min-width:0;cursor:pointer;border:0;text-align:left;transition:transform .15s,box-shadow .2s,outline-color .2s;outline:2px solid transparent}
.tile:hover{transform:translateY(-2px)}
.tile span{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
.tile b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:8px}
.tile em{font-style:normal;font-size:11px;color:var(--faint);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile svg.spark{width:100%;height:28px;margin-top:6px;display:block}
.tile.sel{outline-color:var(--pill)}

.trend{grid-column:span 8}
.platforms{grid-column:span 4;display:flex;flex-direction:column;gap:12px}
.pf{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:var(--r-m);background:var(--panel-2);cursor:pointer;border:0;text-align:left;width:100%;transition:background .2s}
.pf.on{background:var(--pill);color:var(--pill-ink)}
.pf .dot{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff}
.pf .dot svg{width:18px;height:18px}
.pf .bar{display:block;height:6px;border-radius:6px;background:var(--line);margin-top:6px;overflow:hidden}
.pf .bar i{display:block;height:100%;border-radius:6px;transition:width .8s cubic-bezier(.2,.9,.3,1)}
.pf strong{font-size:18px;font-weight:800}
.pf small{color:inherit;opacity:.7;font-size:11px;font-weight:600}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart .ax{fill:var(--faint);font-size:10px;font-family:var(--f);font-weight:600}
svg.chart .gl{stroke:var(--line);stroke-dasharray:3 4}
svg.chart rect.b{cursor:pointer;transition:opacity .25s}
svg.chart rect.b:hover{opacity:.8}
svg.chart.grow rect.b{transform-box:fill-box;transform-origin:bottom;animation:barup .6s cubic-bezier(.2,.9,.3,1) both}
@keyframes barup{from{transform:scaleY(.05)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.seeding{grid-column:span 7}
.stack{grid-column:span 5;display:flex;flex-direction:column;gap:18px;min-width:0}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 150px 64px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .t{min-width:0}
.srow .t b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .t small{color:var(--muted);font-size:11px;font-weight:600}
.srow .v{text-align:right;font-weight:800;font-size:15px}
.srow .v small{font-weight:600;color:var(--muted);font-size:11px}
.prog{height:8px;border-radius:8px;background:var(--panel-2);overflow:hidden}
.prog i{display:block;height:100%;border-radius:8px;transition:width .7s cubic-bezier(.2,.9,.3,1)}
.pl{font-size:11px;font-weight:700;margin-top:4px;display:flex;justify-content:space-between;color:var(--muted)}
.slist{max-height:440px;overflow:auto;padding-right:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.howto{margin-top:12px;padding:12px 14px;border-radius:var(--r-m);background:var(--panel-2);font-size:12px;color:var(--muted);font-weight:600}
.howto b{color:var(--ink)}
.out{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.out div{background:var(--panel-2);border-radius:var(--r-m);padding:12px 10px;min-width:0}
.out span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.out b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.out small{display:block;font-size:10.5px;color:var(--faint);font-weight:600}
.lrow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .rk{font-weight:800;color:var(--faint);font-size:12px}
.lrow b{display:block;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow small{color:var(--muted);font-size:11px;font-weight:600}
.lrow strong{font-weight:800}
.tier{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;display:inline-block}
.tier.main{background:var(--lime);color:var(--lime-ink)}
.tier.support{background:var(--panel-2);color:var(--muted)}

.posts{grid-column:span 12}
.twrap{overflow-x:auto;margin-top:14px;border-radius:var(--r-m)}
table{width:100%;border-collapse:collapse;min-width:1000px;font-size:12.5px}
th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:10px;background:var(--panel-2);white-space:nowrap}
th.r,td.r{text-align:right}
th:first-child{border-radius:12px 0 0 12px}th:last-child{border-radius:0 12px 12px 0}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.ttl{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.pfbadge{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.pfbadge i{width:8px;height:8px;border-radius:50%}
.src{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--panel-2);color:var(--muted)}
.src.auto{background:color-mix(in srgb,var(--yt) 14%,transparent);color:var(--yt)}
a.lk{color:var(--aqua-deep);font-weight:700;text-decoration:none}
a.lk:hover{text-decoration:underline}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r-l)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.note{font-size:11px;color:var(--faint);font-weight:600;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--pill);color:var(--pill-ink);padding:11px 18px;border-radius:999px;font-weight:700;font-size:13px;opacity:0;transition:all .3s cubic-bezier(.3,1.4,.5,1);z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1180px){
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hero,.trend,.seeding,.stack{grid-column:span 12}
  .seedsum,.platforms{grid-column:span 6}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .seedsum,.platforms{grid-column:span 12}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:1fr}
  .hero h3{font-size:23px}
  .srow{grid-template-columns:minmax(0,1fr) 64px}
  .srow .pc{grid-column:1/-1}
  .out{grid-template-columns:repeat(2,minmax(0,1fr))}
  .search{width:100%}
  .tools{width:100%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="logo">CT</div>
    <a href="#overview" class="on press" data-nav aria-label="Tổng quan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a>
    <a href="#seeding" class="press" data-nav aria-label="Seeding"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg></a>
    <a href="#channels" class="press" data-nav aria-label="Kênh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></a>
    <a href="#posts" class="press" data-nav aria-label="Video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg></a>
  </nav>

  <main class="main">
    <header class="top" id="overview">
      <div class="hello">
        <h1 id="greet">UMC Nursing CareTalk</h1>
        <p id="greetSub">Hiệu suất phát hành & seeding theo từng tập</p>
      </div>
      <div class="tools">
        <div class="seg" id="moduleSeg" role="tablist" aria-label="Đối tác">
          <span class="glider" aria-hidden="true"></span>
          <button class="press" role="tab" data-module="mcv">MCV Group</button>
          <button class="press" role="tab" data-module="umc">UMC</button>
        </div>
        <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" type="search" placeholder="Tìm kênh, loại content, tiêu đề…" aria-label="Tìm"></label>
      </div>
    </header>

    <div class="syncbar" id="syncbar">
      <span class="dot"></span><span class="grow" id="syncText">Đang mở Google Sheet…</span>
      <button class="btn btn-ghost press" id="syncBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>Đồng bộ</button>
    </div>

    <div class="eprail" id="eprail" role="tablist" aria-label="Chọn tập"></div>

    <section class="grid">
      <article class="card hero" id="hero"></article>
      <article class="card seedsum" id="seedsum"></article>
    </section>

    <section class="tiles" id="tiles"></section>

    <section class="grid">
      <article class="card trend" id="trend"></article>
      <article class="card platforms" id="platforms"></article>
    </section>

    <section class="grid">
      <article class="card seeding" id="seeding"></article>
      <div class="stack">
        <article class="card" id="output"></article>
        <article class="card" id="channels"></article>
      </div>
    </section>

    <section class="grid">
